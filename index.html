    <style>
      body { font-family: 'Inter', sans-serif; }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #00A3DD; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #0082B1; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

      /* Reset Force Checkbox Appearance */
      input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        background-color: #fff !important;
        margin: 0;
        font: inherit;
        color: #00A3DD;
        width: 1.25rem;
        height: 1.25rem;
        border: 2.5px solid #d1d5db;
        border-radius: 0.375rem;
        display: grid;
        place-content: center;
        cursor: pointer;
        transition: all 0.15s ease-in-out;
        flex-shrink: 0; /* Prevent squishing in flex containers */
      }

      input[type="checkbox"]::before {
        content: "";
        width: 0.65rem;
        height: 0.65rem;
        transform: scale(0);
        transition: 120ms transform ease-in-out;
        box-shadow: inset 1em 1em #00A3DD;
        transform-origin: center;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      }

      input[type="checkbox"]:checked {
        border-color: #00A3DD;
      }

      input[type="checkbox"]:checked::before {
        transform: scale(1);
      }

      input[type="checkbox"]:focus {
        outline: 2px solid rgba(0, 163, 221, 0.3);
        outline-offset: 2px;
      }

      input[type="checkbox"]:hover {
        border-color: #00A3DD;
      }

      /* Global Input Polish - Pure White */
      input, select, textarea {
        background-color: #fff !important;
      }
    </style>
