services:
  # --- Base Stack ---
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: wasomi-pb
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pb_data:/pb_data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wasomi-app
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env.local
        required: false
    stdin_open: true
    tty: true

  # --- Dev Profile Tools ---
  mailpit:
    image: axllent/mailpit:latest
    container_name: wasomi-mailpit
    profiles: [ "dev" ]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: wasomi-minio
    profiles: [ "dev" ]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    env_file:
      - path: .env.local
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mc:
    image: minio/mc:latest
    container_name: wasomi-mc
    profiles: [ "dev" ]
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    entrypoint: >
      /bin/sh -c " set -e; /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password123} > /dev/null 2>&1; /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-research-docs}; "

volumes:
  pb_data:
  minio_data:
